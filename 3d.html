<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Editor 3D · APK EDITING</title>
<link rel="stylesheet" href="css/style.css?v=15">
<link rel="stylesheet" href="css/components.css?v=15">
<link rel="stylesheet" href="css/editor3d.css?v=2">
</head>
<body>
<div id="app3">
  <header class="t3-top">
    <button class="btn" onclick="location.href='index.html'" title="Kembali ke editor video (project 3D tersimpan otomatis)">← Beranda</button>
    <b>Editor 3D</b><small class="meta">teks 3D &amp; kamera sinematik</small><span class="sp"></span>
    <select id="asp" title="Rasio aspek hasil export"><option>16:9</option><option>9:16</option><option>1:1</option></select>
    <select id="res" title="Resolusi export"><option value="720">720p</option><option value="1080" selected>1080p</option></select>
    <button class="btn" id="b-open" title="Buka project 3D dari file">Buka</button>
    <button class="btn" id="b-save" title="Simpan project 3D ke file">Simpan</button>
    <button class="btn" id="b-png" title="Simpan tampilan saat ini sebagai gambar PNG">PNG</button>
    <button class="btn primary" id="b-vid" title="Rekam animasi jadi video (bisa di-import ke editor video)">Rekam Video</button>
  </header>
  <aside class="t3-left">
    <button class="btn primary wide" id="add-text">+ Teks 3D</button>
    <h3>Bentuk pendukung</h3><div id="shapes"></div>
    <h3>Objek</h3><div id="list"></div>
    <label class="row">Warna latar <input type="color" id="bg" value="#121419"></label>
    <label class="row">Tampilkan grid <input type="checkbox" id="grid" checked></label>
  </aside>
  <main class="t3-view">
    <canvas id="gl"></canvas>
    <div id="err" class="t3-err" hidden>WebGL2 tidak didukung di browser ini.</div>
    <p class="hint">Seret: putar kamera · Shift / klik kanan + seret: geser · Roda / cubit: zoom · Ketuk objek: pilih</p>
  </main>
  <aside class="t3-right">
    <div class="tabs"><button class="btn on" data-tab="o">Objek</button><button class="btn" data-tab="c">Kamera</button></div>
    <div id="props"></div><div id="campane" hidden></div>
  </aside>
  <footer class="t3-bot">
    <button class="btn" id="b-play" title="Play / Pause (Space)">▶</button>
    <div class="tl"><input type="range" id="tm" min="0" max="5" step="0.01" value="0" aria-label="Waktu animasi"><div id="ticks" title="Keyframe objek terpilih"></div><div id="ticksc" title="Keyframe kamera"></div></div>
    <span id="tt" class="meta">0.00 / 5.00 s</span>
    <label class="meta">Durasi <input type="number" id="dur" min="0.5" max="120" step="0.5" value="5"></label>
    <label class="meta">Gerak <select id="mo" title="Jenis gerakan antar keyframe"><option value="smooth">Mulus</option><option value="ease">Halus</option><option value="linear">Linear</option></select></label>
    <button class="btn" id="b-kf" title="Rekam posisi, rotasi, dan skala objek terpilih di waktu ini">◆ Keyframe objek</button>
    <button class="btn" id="b-kd" title="Hapus keyframe objek terpilih di waktu ini">Hapus</button>
    <button class="btn cam" id="b-ckf" title="Rekam posisi kamera di waktu ini">◆ Keyframe kamera</button>
  </footer>
</div>
<input type="file" id="f-open" accept=".json,.apk3d" hidden>
<div id="t3" class="t3-toast" role="status"></div>
<script src="js/editor3d.js?v=2"></script>
</body>
</html>
